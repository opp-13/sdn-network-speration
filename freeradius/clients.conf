# FreeRADIUS clients.conf — 템플릿. ${RADIUS_SECRET}는 secrets/radius_secret으로 렌더링된다.

# Faucet (관리망)
client faucet-ctl {
	ipaddr = 10.255.0.10
	secret = ${RADIUS_SECRET}
	require_message_authenticator = yes
	shortname = faucet-ctl
}

# Phase 5 단독 시험용 (eapol_test 컨테이너, Docker 시험 네트워크 172.31.255.0/24에서만)
client eapol-test {
	ipaddr = 172.31.255.0/24
	secret = ${RADIUS_SECRET}
	require_message_authenticator = yes
	shortname = eapol-test
}
