# 업무망 DHCP (eth1.100)
# DNS는 외부로 포워딩하지 않는다 (업무망 → 외부 DNS 차단, t05).
interface=eth1.100
bind-interfaces
except-interface=lo
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
dhcp-range=10.100.0.100,10.100.0.199,255.255.255.0,12h
dhcp-option=option:router,10.100.0.1
dhcp-option=option:dns-server,10.100.0.1
dhcp-authoritative
log-dhcp
