#!/usr/sbin/nft -f
# 경계 방화벽 정책 (fw VM / 로컬 poc-fw netns 공통)
#   eth0      : 관리망 10.255.0.0/24
#   eth1.100  : 업무망   10.100.0.0/24
#   eth1.200  : 인터넷망 10.200.0.0/24
#   eth2      : 외부 출구
# 기본 정책: input / forward 모두 drop.

flush ruleset

table inet fw {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept

    # 업무망/인터넷망 → fw 자신: DHCP, DNS만
    iifname { "eth1.100", "eth1.200" } udp dport { 67, 53 } accept
    iifname { "eth1.100", "eth1.200" } tcp dport 53 accept

    # 관리망 → fw: 상태 확인용 ping만, fw의 관리망 주소로만.
    # (daddr 제한이 없으면 리눅스 weak host 모델 때문에 관리망에서 10.100.0.1 같은
    #  fw의 VLAN 쪽 주소에도 응답한다 — Phase 7 t13에서 발견)
    iifname "eth0" ip saddr 10.255.0.0/24 ip daddr 10.255.0.30 icmp type echo-request accept

    # 그 밖에 eth0으로 들어와 VLAN 쪽 주소를 노리는 패킷은 명시적으로 차단
    iifname "eth0" ip daddr { 10.100.0.0/24, 10.200.0.0/24 } counter drop comment "mgmt->fw-vlan-addr"

    counter log prefix "fw-in-drop " level info
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state invalid drop

    # 인터넷망 → 외부: 허용 (응답은 established로 복귀)
    iifname "eth1.200" oifname "eth2" accept
    iifname "eth2" oifname "eth1.200" ct state established,related accept

    # 명시적 차단 (카운터로 시나리오 검증에 사용)
    iifname "eth1.100" oifname "eth2"     counter drop comment "biz->external"
    iifname "eth1.100" oifname "eth1.200" counter drop comment "biz->inet"
    iifname "eth1.200" oifname "eth1.100" counter drop comment "inet->biz"
    iifname "eth0"     oifname { "eth1.100", "eth1.200" } counter drop comment "mgmt->vlans"

    counter log prefix "fw-fwd-drop " level info
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "eth2" ip saddr 10.200.0.0/24 masquerade
  }
}
