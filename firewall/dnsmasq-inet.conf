# 인터넷망 DHCP + DNS 포워딩 (eth1.200)
# 상위 DNS는 실행 스크립트가 --server 로 지정한다.
interface=eth1.200
bind-interfaces
except-interface=lo
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
dhcp-range=10.200.0.100,10.200.0.199,255.255.255.0,12h
dhcp-option=option:router,10.200.0.1
dhcp-option=option:dns-server,10.200.0.1
dhcp-authoritative
log-dhcp
